name: Check notebooks and mobile extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_notebooks.py --checksums-only
      - run: npm ci && npm test && npm run build
        working-directory: mobile
      - run: python -m pip wheel --no-deps ./mobile --wheel-dir ./mobile/dist
      - run: python -m pip install --no-deps mobile/dist/*.whl && jupyter labextension list
      - uses: actions/upload-artifact@v4
        with:
          name: eigenmath-mobile
          path: mobile/dist/*.whl
